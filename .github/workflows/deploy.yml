name: Build and deploy Cines PY

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static pages
        env:
          SITE_URL: https://yosoymitxel.github.io
          BASE_PATH: /cines.com.py/
        run: npm run build
      - name: Validate generated output
        env:
          SITE_URL: https://yosoymitxel.github.io
          BASE_PATH: /cines.com.py/
        run: npm test
      - name: Install Playwright
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run responsive browser checks
        run: npm run test:browser
      - name: Upload visual review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: artifacts/visual-review/
          if-no-files-found: warn
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
